services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    environment: &app-env
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: billing
      DB_USERNAME: billing
      DB_PASSWORD: billing
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # Runs `php artisan queue:work` against the same codebase/config as `app` -
  # the daily aggregation and invoice-generation jobs are processed here.
  queue:
    build: .
    command: php artisan queue:work --tries=3 --backoff=5
    volumes:
      - .:/var/www
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # Runs the scheduler continuously in the foreground (Laravel's
  # `schedule:work`), which is what actually fires
  # `usage:aggregate-daily` and `billing:generate-due-invoices` on their
  # configured times - see routes/console.php.
  scheduler:
    build: .
    command: php artisan schedule:work
    volumes:
      - .:/var/www
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: billing
      MYSQL_USER: billing
      MYSQL_PASSWORD: billing
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql-data:
